services:
  - type: web
    name: resolveai-support-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-production.txt
    startCommand: python -m production.release
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_EMBEDDED_WORKER
        value: true
      - key: ENABLE_EMAIL_SEND
        value: false
      - key: ALLOW_SIGNUP
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ORIGINS
        value: https://resolveai-support-platform.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://resolveai-support-platform.vercel.app/api/integrations/gmail/callback
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: FILE_ENCRYPTION_KEY
        sync: false

